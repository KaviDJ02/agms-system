server:
  port: 8081

iot:
  api:
    base-url: http://104.211.95.241:8080/api   # Replace with actual IoT API base URL

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
