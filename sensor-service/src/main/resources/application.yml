server:
  port: 8082

iot:
  api:
    base-url: http://104.211.95.241:8080/api   # Replace with actual IoT API base URL
    device-id: your-device-id            # Replace with the deviceId stored during zone creation
    bearer-token: your-bearer-token      # Replace with a valid token (or manage via auth flow)
    zone-id: 1                           # Replace with the zoneId this sensor belongs to

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
